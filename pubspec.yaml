name: niko_rada
description: "Crisis-safety guide for Kenya: grounded, cited answers through Firebase AI Logic hybrid inference (Gemini Nano on-device, cloud with consent)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # AI: Firebase AI Logic hybrid inference, native Android (android/app/build.gradle.kts), called over a
  # MethodChannel from lib/inference/. No Dart model package.

  # --- Local storage ---
  drift: ^2.26.0
  drift_flutter: ^0.2.6
  sqlite3_flutter_libs: ^0.5.29
  path: ^1.9.1
  path_provider: ^2.1.5

  # --- Permissions & audio ---
  permission_handler: ^11.4.0
  record: ^7.1.1

  # --- State & navigation ---
  provider: ^6.1.4
  go_router: ^15.1.2

  # --- UI ---
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.7
  lottie: ^3.3.1

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/corpus/cards.jsonl
    - assets/corpus/SOURCES.md
