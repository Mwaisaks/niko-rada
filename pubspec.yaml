name: niko_rada
description: "Crisis-safety guide for Kenya: grounded, cited answers through Firebase AI Logic hybrid inference (Gemini Nano on-device, cloud with consent)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # AI: Firebase AI Logic hybrid inference, native Android (android/app/build.gradle.kts), called over a
  # MethodChannel from lib/inference/. No Dart model package.

  # --- Local storage (SharedPreferences) & voice notes ---
  path_provider: ^2.1.5
  record: ^7.1.1

  # --- State ---
  provider: ^6.1.4

  # --- UI ---
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/corpus/cards.jsonl
    - assets/corpus/SOURCES.md
    # Outfit, bundled so the app never fetches fonts at runtime (offline-first; no request to Google at launch).
    # SIL Open Font License 1.1: assets/google_fonts/OFL.txt
    - assets/google_fonts/
